media:
  input: media
  output: /media
content:
- name: site
  label: Site-wide and page names
  type: file
  path: content/site.json
  format: json
  fields:
  - name: site
    label: Header, footer and contact
    type: object
    fields:
    - name: masthead_name
      label: Name at the top
      type: string
    - name: masthead_place
      label: City and university at the top
      type: string
    - name: masthead_year
      label: Year at the top
      type: string
    - name: default_palette
      label: Starting colors
      type: select
      options:
        values:
        - bloom
        - milk
        - mix
    - name: end_kicker
      label: Small line above "say hi"
      type: string
    - name: end_a
      label: Big words, first (say)
      type: string
    - name: end_b
      label: Big words, second (hi)
      type: string
    - name: contact_line
      label: Contact line (email, instagram, linkedin)
      type: string
    - name: footer
      label: Small note at the very bottom
      type: string
  - name: pages
    label: 'Pages: names, order, show or hide (drag to reorder)'
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: id
      label: Which page
      type: select
      options:
        values:
        - name: home
          label: Home
        - name: about
          label: About
        - name: medicine
          label: Medicine
        - name: unspoken
          label: The unspoken
        - name: taste
          label: Taste
        - name: notes
          label: Notes
    - name: name
      label: Name shown in the menu
      type: string
    - name: show
      label: Show this page
      type: boolean
      default: true
- name: home
  label: Home page
  type: file
  path: content/home.json
  format: json
  fields:
  - name: kicker
    label: Small line above the name
    type: string
  - name: name_a
    label: Name, first word
    type: string
  - name: name_b
    label: Name, second word (italics)
    type: string
  - name: lede
    label: Tagline
    type: text
  - name: now
    label: The three small facts
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
    fields:
    - name: label
      label: Label
      type: string
    - name: text
      label: Text
      type: string
  - name: worlds_title
    label: Title above the three boxes
    type: string
  - name: worlds
    label: The three boxes
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Name
      type: string
    - name: desc
      label: Short line
      type: string
  - name: quote
    label: Pink quote card
    type: text
  - name: quote_by
    label: Quote author (optional)
    type: string
  - &id001
    name: photos
    label: Photos (add pictures here)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{caption}'
    fields:
    - name: image
      label: Picture
      type: image
    - name: caption
      label: Caption (optional)
      type: string
- name: about
  label: About page
  type: file
  path: content/about.json
  format: json
  fields:
  - name: title_a
    label: Title, first part
    type: string
  - name: title_b
    label: Title, second part (shown in italics)
    type: string
  - name: word
    label: Dictionary word
    type: string
  - name: pronunciation
    label: Pronunciation
    type: string
  - name: meanings
    label: Meanings (add one per item)
    type: string
    list: true
  - name: sticker
    label: Spinning sticker words
    type: string
  - name: portrait
    label: Your portrait (optional)
    type: image
  - name: intro
    label: Intro paragraph
    type: text
  - name: bring_title
    label: 'Title: what I bring'
    type: string
  - name: bring_hint
    label: Hint under that title
    type: string
  - name: traits
    label: Words you can tap
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{k}'
    fields:
    - name: k
      label: Word
      type: string
    - name: note
      label: What shows when tapped
      type: string
  - name: quote
    label: Pink quote card
    type: text
  - name: quote_by
    label: Quote author (optional)
    type: string
  - name: road_title
    label: 'Title: the road ahead'
    type: string
  - name: road
    label: Road ahead steps
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: when
      label: When (now, next, ...)
      type: string
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
  - *id001
- name: medicine
  label: Medicine page
  type: file
  path: content/medicine.json
  format: json
  fields:
  - name: title_a
    label: Title, first part
    type: string
  - name: title_b
    label: Title, second part (shown in italics)
