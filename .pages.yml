  - name: sub
    label: Short line under the title
    type: text
  - name: figures
    label: Numbers
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
    fields:
    - name: value
      label: Number
      type: string
    - name: label
      label: Label
      type: string
    - name: text
      label: Note
      type: text
  - name: chapters_title
    label: Title above the chapters
    type: string
  - name: chapters
    label: Chapters (open and close)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
  - *id001
- name: unspoken
  label: The unspoken page
  type: file
  path: content/unspoken.json
  format: json
  fields:
  - name: title_a
    label: Title, first part
    type: string
  - name: title_b
    label: Title, second part (shown in italics)
    type: string
  - name: sub
    label: Short line under the title
    type: text
  - name: items
    label: Items
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
  - name: quote
    label: Pink quote card
    type: text
  - name: quote_by
    label: Quote author (optional)
    type: string
  - *id001
- name: taste
  label: Taste page
  type: file
  path: content/taste.json
  format: json
  fields:
  - name: title_a
    label: Title, first part
    type: string
  - name: title_b
    label: Title, second part (shown in italics)
    type: string
  - name: sub
    label: Short line under the title
    type: text
  - name: items
    label: Items
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
  - *id001
- name: notes
  label: Notes page
  type: file
  path: content/notes.json
  format: json
  fields:
  - name: title_a
    label: Title, first part
    type: string
  - name: title_b
    label: Title, second part (shown in italics)
    type: string
  - name: sub
    label: Short line under the title
    type: text
  - name: items
    label: Notes
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: tag
      label: Topic tag
      type: string
    - name: title
      label: Title
      type: string
    - name: date
      label: Date
      type: string
  - *id001
